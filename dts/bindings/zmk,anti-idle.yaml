description: "Anti-Idle"

compatible: "zmk,anti-idle"

properties:
  interval-ms:
    description: "Interval between sending anti-idle events in milliseconds."
    type: int
    default: 30000
  bindings:
    type: phandle-array
    required: true
  tap_ms:
    description: "Time in milliseconds to wait for a tap before sending the anti-idle event."
    type: int
  wait_ms:
    description: "Time in milliseconds to wait before sending the anti-idle event."
    type: int
